[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simbench"
version = "0.1.0"
description = "Gymnasium-compatible SDK for SimBench web agent training & evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rahul Sulegaokar" }]
dependencies = [
    "httpx>=0.27",
    "gymnasium>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["simbench"]
