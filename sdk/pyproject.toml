[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simbench"
version = "0.1.0"
description = "Gymnasium-compatible SDK for SimBench web agent training & evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Rahul Sulegaokar" }]
keywords = ["benchmark", "web-agent", "gymnasium", "reinforcement-learning", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "gymnasium>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
simbench = "simbench.cli:main"

[project.urls]
Homepage = "https://github.com/RahulSulegoakar/theta-rl-labs"
Documentation = "https://github.com/RahulSulegoakar/theta-rl-labs/blob/main/sdk/README.md"
Repository = "https://github.com/RahulSulegoakar/theta-rl-labs"

[tool.hatch.build.targets.wheel]
packages = ["simbench"]
