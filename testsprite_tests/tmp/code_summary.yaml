version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16.1.7 (React 19)
  - Tailwind CSS 4.2 with Shadcn/ui
  - DND-Kit (drag-and-drop), Recharts, cmdk, Sonner, Vaul, date-fns
routes:
  - path: /
    file: app/page.tsx
    auth_required: false
    description: Welcome/landing page with site picker
  - path: /login
    file: app/login/page.tsx
    auth_required: false
    description: Email-based login form with SSO options (Google, Facebook, Microsoft, Apple, Slack)
  - path: /switch-account
    file: app/switch-account/page.tsx
    auth_required: false
    description: Account switching and signup page
  - path: /products
    file: app/(products)/products/page.tsx
    auth_required: false
    description: Feature exploration page
  - path: /home
    file: app/(home)/home/page.tsx
    auth_required: true
    description: Dashboard with recent work, apps, and quick links
  - path: /projects
    file: app/(workspace)/projects/page.tsx
    auth_required: true
    description: Projects list with filtering and sorting
  - path: /projects/[key]/board
    file: app/(workspace)/projects/[key]/board/page.tsx
    auth_required: true
    description: Kanban/Scrum board with drag-and-drop columns
  - path: /projects/[key]/backlog
    file: app/(workspace)/projects/[key]/backlog/page.tsx
    auth_required: true
    description: Sprint backlog management with drag-and-drop
  - path: /projects/[key]/summary
    file: app/(workspace)/projects/[key]/summary/page.tsx
    auth_required: true
    description: Project overview and summary
  - path: /projects/[key]/settings
    file: app/(workspace)/projects/[key]/settings/page.tsx
    auth_required: true
    description: Project configuration and settings
  - path: /projects/[key]/code
    file: app/(workspace)/projects/[key]/code/page.tsx
    auth_required: true
    description: Code integration view
  - path: /projects/templates
    file: app/(workspace)/projects/templates/page.tsx
    auth_required: true
    description: Project templates gallery
  - path: /issue/[key]
    file: app/(workspace)/issue/[key]/page.tsx
    auth_required: true
    description: Issue detail view with auto-saving fields
  - path: /dashboards
    file: app/(workspace)/dashboards/page.tsx
    auth_required: true
    description: List of dashboards with owner and viewer info
  - path: /dashboards/[id]
    file: app/(workspace)/dashboards/[id]/page.tsx
    auth_required: true
    description: Individual dashboard with widgets
  - path: /filters
    file: app/(workspace)/filters/page.tsx
    auth_required: true
    description: Saved filters list
  - path: /filters/[slug]
    file: app/(workspace)/filters/[slug]/page.tsx
    auth_required: true
    description: Saved filter results view
  - path: /plans
    file: app/(workspace)/plans/page.tsx
    auth_required: true
    description: Release plans and roadmap management
  - path: /search
    file: app/(workspace)/search/page.tsx
    auth_required: true
    description: Global search across issues, projects, and users
  - path: /apps
    file: app/(workspace)/apps/page.tsx
    auth_required: true
    description: Installed apps marketplace
  - path: /goals
    file: app/(goals)/goals/page.tsx
    auth_required: true
    description: Goals/OKR list with status filtering
  - path: /goals/[id]
    file: app/(goals)/goals/[id]/page.tsx
    auth_required: true
    description: Goal detail view with progress tracking
  - path: /teams
    file: app/(teams)/teams/page.tsx
    auth_required: true
    description: Teams list and management
  - path: /teams/[id]
    file: app/(teams)/teams/[id]/page.tsx
    auth_required: true
    description: Team detail and dashboard
  - path: /teams/directory
    file: app/(teams)/teams/directory/page.tsx
    auth_required: true
    description: Team discovery directory
  - path: /home/account-settings
    file: app/(home)/home/account-settings/page.tsx
    auth_required: true
    description: User account configuration
  - path: /home/profile
    file: app/(home)/home/profile/page.tsx
    auth_required: true
    description: User profile management
  - path: /home/notifications
    file: app/(home)/home/notifications/page.tsx
    auth_required: true
    description: Notification center
  - path: /home/recent
    file: app/(home)/home/recent/page.tsx
    auth_required: true
    description: Recently viewed items
  - path: /home/starred
    file: app/(home)/home/starred/page.tsx
    auth_required: true
    description: Starred/bookmarked items
  - path: /kudos
    file: app/(kudos)/kudos/page.tsx
    auth_required: true
    description: Kudos/recognition board
features:
  - name: User Login
    description: Login with email address, SSO buttons for Google/Facebook/Microsoft/Apple/Slack
    files:
      - app/login/page.tsx
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Click Continue button to submit login
      - Click SSO provider button (Google, Facebook, Microsoft, Apple, Slack)
      - See redirect to /home on successful login
    api_calls: []
    auth_required: false
  - name: Projects List
    description: Browse, filter, and sort all projects in the workspace
    files:
      - app/(workspace)/projects/page.tsx
      - app/api/data/projects/route.ts
    entry_route: /projects
    user_interactions:
      - View projects in a table with name, key, type, lead
      - Click project row to navigate to project board
      - Filter projects by type or search
      - Sort table by column headers
      - Open gear menu for project actions (archive, move to trash)
    api_calls:
      - method: GET
        endpoint: /api/data/projects
    auth_required: true
  - name: Project Board (Kanban)
    description: Drag-and-drop Kanban board with columns mapped to workflow states
    files:
      - app/(workspace)/projects/[key]/board/page.tsx
      - app/api/data/boards/route.ts
      - app/api/data/issues/route.ts
    entry_route: /projects/[key]/board
    user_interactions:
      - View issue cards in workflow columns (To Do, In Progress, Done, etc.)
      - Drag issue cards between columns to change status
      - Click issue card to open issue detail drawer
      - See priority and type indicators on cards
      - See assignee avatars on cards
    api_calls:
      - method: GET
        endpoint: /api/data/boards
      - method: GET
        endpoint: /api/data/issues
      - method: PUT
        endpoint: /api/data/issues/[key]
    auth_required: true
  - name: Sprint Backlog Management
    description: Manage sprints and drag issues between sprints in the backlog view
    files:
      - app/(workspace)/projects/[key]/backlog/page.tsx
      - app/api/data/sprints/route.ts
    entry_route: /projects/[key]/backlog
    user_interactions:
      - Collapse and expand sprint sections
      - Drag issues between sprints
      - Click Start Sprint button
      - Click Complete Sprint button with confirmation dialog
      - View sprint goals and duration
      - Filter backlog by epic
    api_calls:
      - method: GET
        endpoint: /api/data/sprints
      - method: POST
        endpoint: /api/data/sprints
      - method: POST
        endpoint: /api/data/sprints/[id]/start
      - method: POST
        endpoint: /api/data/sprints/[id]/complete
    auth_required: true
  - name: Issue Detail View
    description: Full issue detail page with editable fields and auto-saving
    files:
      - app/(workspace)/issue/[key]/page.tsx
      - app/api/data/issues/[key]/route.ts
      - app/api/data/issues/[key]/comments/route.ts
      - app/api/data/issues/[key]/history/route.ts
    entry_route: /issue/[key]
    user_interactions:
      - Edit issue summary (title) inline
      - Edit description field
      - Change issue type, status, priority via dropdowns
      - Assign/change assignee and reporter
      - Set sprint, epic, story points, labels
      - Add comments with Cmd/Ctrl+Enter to submit
      - View change history and activity feed
      - See auto-save indicator (saving/saved state)
    api_calls:
      - method: GET
        endpoint: /api/data/issues/[key]
      - method: PUT
        endpoint: /api/data/issues/[key]
      - method: GET
        endpoint: /api/data/issues/[key]/comments
      - method: POST
        endpoint: /api/data/issues/[key]/comments
      - method: GET
        endpoint: /api/data/issues/[key]/history
    auth_required: true
  - name: Global Search
    description: Full-text search across issues, projects, and users
    files:
      - app/(workspace)/search/page.tsx
      - app/api/data/search/route.ts
    entry_route: /search
    user_interactions:
      - Type search query in search input
      - View grouped results (issues, projects, users)
      - Click a result to navigate to item
      - Apply optional filters (status, assignee)
    api_calls:
      - method: GET
        endpoint: /api/data/search?q=[query]&issueLimit=50
    auth_required: true
  - name: Dashboards
    description: Custom dashboards with widgets and sharing controls
    files:
      - app/(workspace)/dashboards/page.tsx
      - app/(workspace)/dashboards/[id]/page.tsx
    entry_route: /dashboards
    user_interactions:
      - List dashboards with owner, viewers, editors info
      - Click Create Dashboard button
      - Fill dashboard creation dialog form
      - Click a dashboard to view it
      - Star/favorite a dashboard
      - Filter dashboards by owner
    api_calls:
      - method: GET
        endpoint: /api/data/boards
    auth_required: true
  - name: Filters
    description: Save and manage issue filters (JQL-like)
    files:
      - app/(workspace)/filters/page.tsx
      - app/(workspace)/filters/[slug]/page.tsx
      - app/api/data/filters/route.ts
    entry_route: /filters
    user_interactions:
      - Browse saved filters in table
      - Click filter to view results
      - Create new filter
      - Delete or edit existing filter
    api_calls:
      - method: GET
        endpoint: /api/data/filters
    auth_required: true
  - name: Goals/OKR Tracking
    description: Goal management with status tracking and team assignment
    files:
      - app/(goals)/goals/page.tsx
      - app/(goals)/goals/[id]/page.tsx
      - app/api/data/goals/route.ts
    entry_route: /goals
    user_interactions:
      - List goals with status (ON TRACK, AT RISK, OFF TRACK)
      - Filter goals by tag, status, owner, team, starred
      - Create new goal via dialog
      - Click goal to view details
      - Follow/unfollow a goal
      - View progress metrics
    api_calls:
      - method: GET
        endpoint: /api/data/goals
      - method: POST
        endpoint: /api/data/goals
    auth_required: true
  - name: Teams Management
    description: Team creation, browsing, and member management
    files:
      - app/(teams)/teams/page.tsx
      - app/(teams)/teams/[id]/page.tsx
      - app/(teams)/teams/directory/page.tsx
      - app/api/data/teams/route.ts
    entry_route: /teams
    user_interactions:
      - Browse teams list
      - Search team directory
      - Create new team
      - View team members and details
      - Join or leave a team
    api_calls:
      - method: GET
        endpoint: /api/data/teams
      - method: POST
        endpoint: /api/data/teams
    auth_required: true
  - name: Plans/Roadmap
    description: Release planning with access-level controls
    files:
      - app/(workspace)/plans/page.tsx
      - app/api/data/plans/route.ts
    entry_route: /plans
    user_interactions:
      - List plans with descriptions and access levels
      - Click Create Plan button
      - Fill plan creation form (name, sources, access level)
      - Select work sources (space, board, filter)
    api_calls:
      - method: GET
        endpoint: /api/data/plans
      - method: POST
        endpoint: /api/data/plans
    auth_required: true
  - name: Navigation & Sidebar
    description: App sidebar with project links, starred items, and workspace navigation
    files:
      - components/app-sidebar.tsx
      - components/top-nav.tsx
    entry_route: /home
    user_interactions:
      - Click sidebar links to navigate between sections
      - Expand/collapse sidebar sections
      - Use top navigation bar for search and user menu
      - Toggle dark/light theme
      - Click user avatar to access profile and logout
    api_calls: []
    auth_required: true
known_limitations:
  - issue: Authentication is mock - any email input redirects to home without validation
    location: app/login/page.tsx
    impact: No real credential validation or session management
  - issue: All data is in-memory mock data, not persisted to a database
    location: app/lib/mock-data.ts, app/lib/store.ts
    impact: All changes are lost on page refresh or server restart
  - issue: Admin panel routes are UI stubs with no real functionality
    location: app/(admin)/ routes
    impact: 40+ admin pages render but have no working CRUD operations
  - issue: Notifications are UI-only with no real notification system
    location: app/(home)/home/notifications/page.tsx
    impact: Shows static notification UI but no real push/email notifications
  - issue: Project templates gallery does not create actual projects
    location: app/(workspace)/projects/templates/page.tsx
    impact: Template selection is visual only
  - issue: Code integration view is a UI stub
    location: app/(workspace)/projects/[key]/code/page.tsx
    impact: No real VCS integration
