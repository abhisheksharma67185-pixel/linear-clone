[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theta-observability"
dynamic = ["version"]
description = "Theta Observability — multimodal agent tracing SDK (text, images, audio, video, robotics sensors)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Theta" }]
keywords = ["observability", "tracing", "agents", "llm", "multimodal", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
pil = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4"]

[project.urls]
Homepage = "https://theta-observability.com"
Documentation = "https://theta-observability.com/docs"
Repository = "https://github.com/RahulSulegoakar/theta-rl-labs"

[tool.hatch.version]
path = "src/theta_observability/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/theta_observability"]
