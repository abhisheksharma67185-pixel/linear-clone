# Theta Observability — local development stack.
#
# Usage:
#   docker compose -f observability/docker-compose.dev.yml up
#
# Services:
#   postgres       control-plane DB (orgs, projects, api keys, NextAuth)
#   fake-gcs       GCS emulator for trace JSON + media blobs
#   bq-emulator    BigQuery emulator for searchable trace index
#   migrate        one-shot goose runner that applies schema/postgres/
#   api            Go ingest API (built from ./api-go)
#   dashboard      Next.js dashboard (built from ./dashboard)
#
# NB: BigQuery emulator quirks — see README ("BigQuery emulator caveats").

name: theta-obs

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: theta-obs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: theta_obs
      POSTGRES_USER: theta
      POSTGRES_PASSWORD: theta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theta -d theta_obs"]
      interval: 3s
      timeout: 3s
      retries: 20

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: theta-obs-fake-gcs
    restart: unless-stopped
    command: >
      -scheme http
      -public-host localhost:4443
      -host 0.0.0.0
      -port 4443
      -data /data
      -filesystem-root /storage
    ports:
      - "4443:4443"
    volumes:
      - gcs-data:/storage
      # Seed bucket by mounting an empty directory named after the bucket.
      - ./.dev/gcs-seed/theta-obs-dev:/data/theta-obs-dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  bq-emulator:
    image: ghcr.io/goccy/bigquery-emulator:latest
    platform: linux/amd64
    container_name: theta-obs-bq
    restart: unless-stopped
    command:
      - --project=theta-obs-dev
      - --dataset=theta_observability
      - --port=9050
    ports:
      - "9050:9050"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9050/discovery/v1/apis/bigquery/v2/rest || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/pressly/goose:latest
    container_name: theta-obs-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=theta password=theta dbname=theta_obs sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./schema/postgres:/migrations:ro
    command: ["up"]
    restart: "no"

  api:
    build:
      context: ./api-go
    container_name: theta-obs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
      bq-emulator:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DB_URL: "postgres://theta:theta@postgres:5432/theta_obs?sslmode=disable"
      GCS_ENDPOINT: "http://fake-gcs:4443/storage/v1/"
      GCS_PUBLIC_HOST: "http://localhost:4443"
      GCS_BUCKET: "theta-obs-dev"
      STORAGE_EMULATOR_HOST: "fake-gcs:4443"
      BQ_PROJECT: "theta-obs-dev"
      BQ_DATASET: "theta_observability"
      BIGQUERY_EMULATOR_HOST: "bq-emulator:9050"
      JWT_SECRET: "dev-jwt-secret-change-me"
      JWT_JWKS_URL: "http://dashboard:3100/api/auth/jwks"
      ENV: "dev"
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./dashboard
    container_name: theta-obs-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: "development"
      PORT: "3100"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      API_URL_INTERNAL: "http://api:8080"
      DATABASE_URL: "postgres://theta:theta@postgres:5432/theta_obs?sslmode=disable"
      NEXTAUTH_URL: "http://localhost:3100"
      NEXTAUTH_SECRET: "dev-nextauth-secret-change-me"
      JWT_SECRET: "dev-jwt-secret-change-me"
    ports:
      - "3100:3100"

volumes:
  postgres-data:
  gcs-data:
